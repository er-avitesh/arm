<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tile Styles — Round 2</title>
<style>
:root{--page:#ecfeff;--card:#fff;--border:#e2e8f0;--ink:#1e293b;--ink2:#64748b;--muted:#94a3b8;--brand:#0e7490;--track:#f1f5f9;}
*{box-sizing:border-box;}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
.wrap{max-width:1160px;margin:0 auto;padding:26px 16px 70px;}
h1{font-size:23px;font-weight:800;margin:0 0 4px;}
.sub{color:var(--ink2);font-size:13.5px;margin-bottom:24px;line-height:1.6;}
.sec{margin-bottom:34px;}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px;}
.tag{background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 8px;letter-spacing:.4px;}
.tag.short{background:#0ca30c;}
.st{font-size:16.5px;font-weight:800;}
.sp{color:var(--ink2);font-size:12.5px;margin:0 0 12px;line-height:1.6;}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px;}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin-top:11px;}
.cap{font-size:11px;color:var(--muted);margin-top:9px;font-weight:600;}

/* ---- S: shortlisted soft wash (reference) ---- */
.s{border-radius:16px;padding:16px 18px;border:1.5px solid transparent;}
.s .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.s .l{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;opacity:.75;}
.s .ic{font-size:17px;opacity:.55;}
.s .v{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.5px;}
.s .sb{font-size:10.5px;margin-top:6px;opacity:.7;font-weight:600;}

/* ---- 1: gradient wash + coloured glow ---- */
.g1{border-radius:18px;padding:17px 19px;border:1px solid;position:relative;}
.g1 .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;}
.g1 .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;}
.g1 .ic{font-size:16px;opacity:.5;}
.g1 .v{font-size:27px;font-weight:800;line-height:1;letter-spacing:-.6px;}
.g1 .sb{font-size:10.5px;margin-top:7px;opacity:.72;font-weight:600;}

/* ---- 2: frosted glass ---- */
.g2{border-radius:18px;padding:17px 19px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 20px rgba(14,116,144,.10);backdrop-filter:blur(8px);}
.g2 .blob{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(26px);opacity:.55;
  right:-34px;top:-40px;pointer-events:none;}
.g2 .in{position:relative;}
.g2 .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;}
.g2 .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);}
.g2 .ic{font-size:16px;}
.g2 .v{font-size:27px;font-weight:800;line-height:1;letter-spacing:-.6px;}
.g2 .sb{font-size:10.5px;margin-top:7px;color:var(--ink2);font-weight:600;}

/* ---- 3: ghost icon watermark ---- */
.g3{border-radius:18px;padding:17px 19px;position:relative;overflow:hidden;border:1px solid;}
.g3 .gh{position:absolute;right:-12px;bottom:-22px;font-size:82px;opacity:.10;transform:rotate(-12deg);
  line-height:1;pointer-events:none;}
.g3 .in{position:relative;}
.g3 .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.72;margin-bottom:10px;}
.g3 .v{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.6px;}
.g3 .sb{font-size:10.5px;margin-top:7px;opacity:.7;font-weight:600;}

/* ---- 4: split two-tone ---- */
.g4{border-radius:16px;overflow:hidden;display:flex;border:1px solid;
  box-shadow:0 2px 10px rgba(14,116,144,.08);}
.g4 .lft{width:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.g4 .rt{flex:1;padding:15px 16px;min-width:0;}
.g4 .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.55px;opacity:.75;margin-bottom:7px;}
.g4 .v{font-size:25px;font-weight:800;line-height:1;letter-spacing:-.5px;}
.g4 .sb{font-size:10.5px;margin-top:6px;opacity:.7;font-weight:600;}

/* ---- 5: gradient figure ---- */
.g5{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px 18px;
  box-shadow:0 1px 5px rgba(14,116,144,.07);}
.g5 .top{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.g5 .ic{font-size:14px;opacity:.75;}
.g5 .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.55px;color:var(--ink2);}
.g5 .v{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.6px;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.g5 .ul{width:30px;height:3px;border-radius:2px;margin-top:10px;}
.g5 .sb{font-size:10.5px;color:var(--muted);margin-top:7px;}

/* ---- 6: pastel pill, floating badge ---- */
.g6{border-radius:22px;padding:24px 18px 17px;position:relative;margin-top:14px;border:1px solid;}
.g6 .badge{position:absolute;top:-14px;left:18px;width:40px;height:40px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 3px 10px rgba(14,116,144,.16);}
.g6 .v{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.5px;margin-top:4px;}
.g6 .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.55px;opacity:.72;margin-top:7px;}
.g6 .sb{font-size:10.5px;margin-top:6px;opacity:.7;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stat tile — six more, leaning into the soft look</h1>
  <p class="sub">Your pick is at the top marked shortlisted. The six below all build on that same soft, tinted direction rather than going somewhere else — same four figures, same supporting-line row underneath each.</p>
  <div id="root"></div>
</div>
<script>
const T=[["💰","₹0","Total Revenue Collected","#0e7490"],
         ["📈","-₹1.45 L","Net Profit","#ef4444"],
         ["🏦","₹0","Cash Position","#8b5cf6"],
         ["🏗️","1","Active Projects","#f59e0b"]];
const S=[["🔴","2","Overdue Invoices","#ef4444","₹3.76 L outstanding"],
         ["📄","₹1.39 L","Net GST Payable","#8b5cf6","Output ₹4.80 L − Input ₹1.90 L"]];
const dk=c=>({"#0e7490":"#083f4d","#ef4444":"#a31212","#8b5cf6":"#5b21b6","#f59e0b":"#a35a06"}[c]||c);

const R={
 s:(i,v,l,c,b)=>`<div class="s" style="background:${c}0f;border-color:${c}33;color:${c}">
    <div class="top"><span class="l">${l}</span><span class="ic">${i}</span></div>
    <div class="v">${v}</div>${b?`<div class="sb">${b}</div>`:''}</div>`,

 g1:(i,v,l,c,b)=>`<div class="g1" style="background:linear-gradient(140deg,${c}1f,${c}06 65%,#fff);
    border-color:${c}2e;box-shadow:0 5px 18px ${c}24;color:${c}">
    <div class="top"><span class="l">${l}</span><span class="ic">${i}</span></div>
    <div class="v">${v}</div>${b?`<div class="sb">${b}</div>`:''}</div>`,

 g2:(i,v,l,c,b)=>`<div class="g2"><div class="blob" style="background:${c}"></div><div class="in">
    <div class="top"><span class="l">${l}</span><span class="ic">${i}</span></div>
    <div class="v" style="color:${c}">${v}</div>${b?`<div class="sb">${b}</div>`:''}</div></div>`,

 g3:(i,v,l,c,b)=>`<div class="g3" style="background:${c}12;border-color:${c}2b;color:${c}">
    <div class="gh">${i}</div><div class="in">
    <div class="l">${l}</div><div class="v">${v}</div>
    ${b?`<div class="sb">${b}</div>`:''}</div></div>`,

 g4:(i,v,l,c,b)=>`<div class="g4" style="border-color:${c}2b">
    <div class="lft" style="background:linear-gradient(160deg,${c},${dk(c)})">${i}</div>
    <div class="rt" style="background:${c}0d;color:${c}">
      <div class="l">${l}</div><div class="v">${v}</div>
      ${b?`<div class="sb">${b}</div>`:''}</div></div>`,

 g5:(i,v,l,c,b)=>`<div class="g5">
    <div class="top"><span class="ic">${i}</span><span class="l">${l}</span></div>
    <div class="v" style="background-image:linear-gradient(120deg,${c},${dk(c)})">${v}</div>
    <div class="ul" style="background:linear-gradient(90deg,${c},${c}33)"></div>
    ${b?`<div class="sb">${b}</div>`:''}</div>`,

 g6:(i,v,l,c,b)=>`<div class="g6" style="background:${c}14;border-color:${c}2b;color:${c}">
    <div class="badge">${i}</div><div class="v">${v}</div><div class="l">${l}</div>
    ${b?`<div class="sb">${b}</div>`:''}</div>`
};

const SECS=[
 {tag:'SHORTLISTED',cls:'short',t:'Soft colour wash — your pick',
  p:'Kept here for comparison. Flat tint, hairline border, everything in the tile colour.',k:'s'},
 {tag:'STYLE 7',cls:'',t:'Gradient wash with a coloured glow',
  p:'The same idea, softened further — the tint fades diagonally into white and the tile casts a faint shadow in its own colour, so it lifts off the page instead of sitting flat on it.',k:'g1'},
 {tag:'STYLE 8',cls:'',t:'Frosted glass',
  p:'A blurred halo of colour sits behind a translucent white pane. The colour reads as light rather than paint, which keeps four different hues from competing.',k:'g2'},
 {tag:'STYLE 9',cls:'',t:'Ghost icon watermark',
  p:'Soft tint again, but the icon becomes a large faded watermark bleeding off the corner. Frees the top row so the number sits higher and reads bigger.',k:'g3'},
 {tag:'STYLE 10',cls:'',t:'Split two-tone',
  p:'A solid gradient panel carries the icon on the left, the soft tint carries the number on the right. The most structured of the set and the easiest to pick out at a glance.',k:'g4'},
 {tag:'STYLE 11',cls:'',t:'Gradient figure on white',
  p:'Tile stays clean white; the colour lives in the number itself, which fades across a gradient, plus a short underline. The most restrained — the figure is the only coloured thing.',k:'g5'},
 {tag:'STYLE 12',cls:'',t:'Pastel pill with floating badge',
  p:'Deeper rounding, pastel fill, and a white circular icon badge that overlaps the top edge. Softest and most app-like of the set.',k:'g6'}
];
document.getElementById('root').innerHTML=SECS.map(s=>`<div class="sec">
  <div class="sh"><span class="tag ${s.cls}">${s.tag}</span><span class="st">${s.t}</span></div>
  <p class="sp">${s.p}</p>
  <div class="row">${T.map(t=>R[s.k](...t)).join('')}</div>
  <div class="row2">${S.map(t=>R[s.k](...t)).join('')}</div>
  <div class="cap">↑ four Admin tiles · ↓ same style with a supporting line</div></div>`).join('');
</script>
</body>
</html>
