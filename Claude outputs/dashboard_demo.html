<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SolarEPC Dashboard — Role Preview (Demo Data)</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --brand:#0e7490; --brand-dark:#0b5b73; --brand-light:#ecfeff; --brand-ring:#a5f3fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-250:#86b6ef; --seq-350:#5598e7; --seq-450:#2a78d6; --seq-550:#1c5cab;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --success-text:#006300;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --brand:#22a5c2; --brand-dark:#1c8aa3; --brand-light:#0f2a30; --brand-ring:#1c4a54;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-250:#5598e7; --seq-350:#2a78d6; --seq-450:#1c5cab; --seq-550:#104281;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
    --success-text:#0ca30c;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 60px;}

/* ---------- top chrome ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;}
.topbar-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:flex;align-items:center;justify-content:center;font-size:15px;}
.role-switch{display:flex;gap:6px;flex-wrap:wrap;}
.role-btn{border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink-2);padding:8px 14px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;gap:6px;}
.role-btn:hover{background:var(--brand-light);}
.role-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.role-caption{max-width:1320px;margin:14px auto 0;padding:0 20px;}
.caption-card{background:var(--brand-light);border:1px solid var(--brand-ring);border-radius:12px;padding:12px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.6;}
.caption-card b{color:var(--ink);}

.dash{display:none;padding-top:22px;}
.dash.active{display:block;}

.dash-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.dash-head h1{font-size:23px;font-weight:800;margin:0 0 4px;}
.dash-head .sub{color:var(--ink-2);font-size:13px;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink-2);padding:7px 12px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.filter-btn.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}

/* ---------- grid & cards ---------- */
.grid{display:grid;gap:14px;}
.g-kpis{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2r{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:980px){.g-kpis{grid-template-columns:repeat(2,1fr);}.g-2,.g-2r,.g-3{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
.card h3{font-size:13.5px;font-weight:800;margin:0 0 3px;display:flex;align-items:center;gap:7px;}
.card .card-sub{font-size:11.5px;color:var(--ink-muted);margin-bottom:14px;}

/* ---------- stat tile ---------- */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
.stat .icon{position:absolute;top:14px;right:16px;font-size:20px;opacity:.5;}
.stat .label{font-size:11.5px;color:var(--ink-2);font-weight:700;margin-bottom:6px;}
.stat .value{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.stat .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.stat .delta.up{color:var(--success-text);}
.stat .delta.down{color:var(--critical);}
.stat svg.spark{display:block;margin-top:8px;}

/* ---------- legend / tooltip ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-2);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-line{width:14px;height:2px;border-radius:2px;flex-shrink:0;}
.viz-tooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:9px;padding:9px 12px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .1s;z-index:30;min-width:120px;}
.viz-tooltip .tt-title{font-weight:700;margin-bottom:5px;color:var(--surface);opacity:.75;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;}
.viz-tooltip .tt-row{display:flex;align-items:center;gap:7px;justify-content:space-between;}
.viz-tooltip .tt-key{display:flex;align-items:center;gap:6px;color:var(--surface);opacity:.85;}
.viz-tooltip .tt-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.viz-tooltip .tt-val{font-weight:800;}
.chart-box{position:relative;}

/* ---------- lists ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--grid);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{width:22px;height:22px;border-radius:7px;background:var(--brand-light);color:var(--brand);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lb-name{font-weight:700;font-size:13px;flex:1;min-width:0;}
.lb-sub{font-size:11px;color:var(--ink-muted);}
.lb-val{font-weight:800;font-size:13px;white-space:nowrap;}

.alert-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;margin-bottom:7px;font-size:12.5px;}
.alert-row .a-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.alert-row.crit{background:color-mix(in srgb, var(--critical) 10%, var(--surface));}
.alert-row.crit .a-icon{background:color-mix(in srgb, var(--critical) 20%, var(--surface));color:var(--critical);}
.alert-row.warn{background:color-mix(in srgb, var(--warning) 12%, var(--surface));}
.alert-row.warn .a-icon{background:color-mix(in srgb, var(--warning) 25%, var(--surface));color:#8a5c00;}
.alert-row .a-text b{display:block;color:var(--ink);}
.alert-row .a-text span{color:var(--ink-2);font-size:11px;}

.task-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:12.5px;}
.task-row:last-child{border-bottom:none;}
.chk{width:18px;height:18px;border-radius:6px;border:2px solid var(--baseline);flex-shrink:0;}
.chk.done{background:var(--good);border-color:var(--good);}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;}
.tag.high{background:color-mix(in srgb, var(--critical) 15%, var(--surface));color:var(--critical);}
.tag.med{background:color-mix(in srgb, var(--warning) 20%, var(--surface));color:#8a5c00;}
.tag.low{background:color-mix(in srgb, var(--s1) 15%, var(--surface));color:var(--s1);}

.meter-row{margin-bottom:14px;}
.meter-row:last-child{margin-bottom:0;}
.meter-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;}
.meter-top .mname{font-weight:700;}
.meter-track{height:8px;border-radius:5px;background:var(--brand-light);overflow:hidden;}
.meter-fill{height:100%;border-radius:5px;background:var(--brand);}

table.simple{width:100%;border-collapse:collapse;font-size:12.5px;}
table.simple th{text-align:left;color:var(--ink-muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:0 10px 10px 0;border-bottom:1px solid var(--grid);}
table.simple td{padding:10px 10px 10px 0;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;}
table.simple tr:last-child td{border-bottom:none;}
.status-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-pill.good{background:color-mix(in srgb, var(--good) 14%, var(--surface));color:var(--success-text);}
.status-pill.warn{background:color-mix(in srgb, var(--warning) 20%, var(--surface));color:#8a5c00;}
.status-pill.crit{background:color-mix(in srgb, var(--critical) 15%, var(--surface));color:var(--critical);}
.status-pill.neutral{background:color-mix(in srgb, var(--s1) 14%, var(--surface));color:var(--s1);}

.footnote{font-size:11px;color:var(--ink-muted);margin-top:8px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo">☀️</span> SolarEPC — Dashboard Preview <span style="font-weight:600;color:var(--ink-muted);font-size:12px;">(demo data)</span></div>
    <div class="role-switch" id="roleSwitch"></div>
  </div>
</div>
<div class="role-caption"><div class="caption-card" id="roleCaption"></div></div>

<div class="wrap" id="dashHost"></div>

<script>
/* =========================================================================
   SHARED CHART ENGINE — vanilla SVG, no external libraries
   ========================================================================= */
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function div(cls){const d=document.createElement("div");if(cls)d.className=cls;return d;}
function fmtINR(n){const a=Math.abs(n);const sign=n<0?"-":"";
  if(a>=10000000)return sign+"₹"+(a/10000000).toFixed(2)+" Cr";
  if(a>=100000)return sign+"₹"+(a/100000).toFixed(2)+" L";
  if(a>=1000)return sign+"₹"+(a/1000).toFixed(1)+"K";
  return sign+"₹"+Math.round(a);}
function fmtNum(n){return Math.round(n).toLocaleString("en-IN");}
function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;let m;if(n<=1)m=1;else if(n<=2)m=2;else if(n<=5)m=5;else m=10;return m*p;}

function makeTooltip(container){const tt=div("viz-tooltip");container.style.position="relative";container.appendChild(tt);return tt;}
function showTip(tt,x,y,html){tt.innerHTML=html;tt.style.opacity="1";const cw=tt.parentElement.clientWidth;let left=x+14;if(left+tt.offsetWidth>cw)left=x-tt.offsetWidth-14;tt.style.left=left+"px";tt.style.top=Math.max(4,y-tt.offsetHeight-10)+"px";}
function hideTip(tt){tt.style.opacity="0";}

/* ---- Line / area chart, multi-series, crosshair tooltip ---- */
function renderLineChart(host,{labels,series,height=220,formatY=fmtINR,area=false}){
  const box=div("chart-box");host.appendChild(box);
  const W=800,H=height,padL=44,padR=14,padT=14,padB=28;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const allVals=series.flatMap(s=>s.values);
  const maxV=niceMax(Math.max(...allVals,1));
  const minV=Math.min(0,Math.min(...allVals));
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,style:"width:100%;height:auto;display:block;overflow:visible"},box);
  const x=i=>padL+(plotW*(labels.length===1?0.5:i/(labels.length-1)));
  const y=v=>padT+plotH-((v-minV)/(maxV-minV||1))*plotH;
  // gridlines + y ticks
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v=minV+(maxV-minV)*i/steps;
    const gy=y(v);
    el("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:"var(--grid)","stroke-width":1},svg);
    const t=el("text",{x:padL-8,y:gy+3,"text-anchor":"end","font-size":10,fill:"var(--ink-muted)"},svg);
    t.textContent=formatY(v);
  }
  // baseline
  el("line",{x1:padL,x2:W-padR,y1:padT+plotH,y2:padT+plotH,stroke:"var(--baseline)","stroke-width":1},svg);
  // x labels (sparse)
  const everyN=Math.ceil(labels.length/7);
  labels.forEach((lb,i)=>{if(i%everyN!==0&&i!==labels.length-1)return;const t=el("text",{x:x(i),y:H-8,"text-anchor":"middle","font-size":10,fill:"var(--ink-muted)"},svg);t.textContent=lb;});
  // series
  series.forEach((s,si)=>{
    if(area&&series.length===1){
      let d=`M ${x(0)} ${y(0)} `;s.values.forEach((v,i)=>d+=`L ${x(i)} ${y(v)} `);d+=`L ${x(s.values.length-1)} ${y(0)} Z`;
      el("path",{d,fill:s.color,opacity:0.1},svg);
    }
    let d="";s.values.forEach((v,i)=>{d+=(i===0?"M":"L")+` ${x(i)} ${y(v)} `;});
    el("path",{d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
    const lastI=s.values.length-1;
    el("circle",{cx:x(lastI),cy:y(s.values[lastI]),r:4,fill:s.color,stroke:"var(--surface)","stroke-width":2},svg);
  });
  // crosshair + hover
  const tt=makeTooltip(box);
  const chLine=el("line",{y1:padT,y2:padT+plotH,stroke:"var(--baseline)","stroke-width":1,opacity:0},svg);
  const hitLayer=el("rect",{x:padL,y:padT,width:plotW,height:plotH,fill:"transparent"},svg);
  function onMove(evt){
    const rect=svg.getBoundingClientRect();
    const px=(evt.clientX-rect.left)*(W/rect.width);
    let idx=Math.round((px-padL)/plotW*(labels.length-1));
    idx=Math.max(0,Math.min(labels.length-1,idx));
    chLine.setAttribute("x1",x(idx));chLine.setAttribute("x2",x(idx));chLine.setAttribute("opacity",1);
    let rows=series.map(s=>`<div class="tt-row"><span class="tt-key"><span class="tt-swatch" style="background:${s.color}"></span>${s.name}</span><span class="tt-val">${formatY(s.values[idx])}</span></div>`).join("");
    showTip(tt,evt.clientX-rect.left,evt.clientY-rect.top,`<div class="tt-title">${labels[idx]}</div>${rows}`);
  }
  hitLayer.addEventListener("mousemove",onMove);
  hitLayer.addEventListener("mouseleave",()=>{chLine.setAttribute("opacity",0);hideTip(tt);});
  if(series.length>=2){
    const lg=div("legend");
    series.forEach(s=>{const it=div("legend-item");const sw=div("legend-line");sw.style.background=s.color;it.appendChild(sw);const sp=document.createElement("span");sp.textContent=s.name;it.appendChild(sp);lg.appendChild(it);});
    box.appendChild(lg);
  }
}

/* ---- Vertical bar chart, single series (nominal categories -> one hue) ---- */
function renderBarChart(host,{labels,values,color="var(--s1)",height=220,formatY=fmtINR,perBarColors=null}){
  const box=div("chart-box");host.appendChild(box);
  const W=800,H=height,padL=44,padR=14,padT=14,padB=34;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const maxV=niceMax(Math.max(...values,1));
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,style:"width:100%;height:auto;display:block"},box);
  const n=values.length;
  const slot=plotW/n;
  const barW=Math.min(24,slot*0.55);
  const y=v=>padT+plotH-(v/maxV)*plotH;
  const steps=4;
  for(let i=0;i<=steps;i++){const v=maxV*i/steps;const gy=y(v);el("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:"var(--grid)","stroke-width":1},svg);const t=el("text",{x:padL-8,y:gy+3,"text-anchor":"end","font-size":10,fill:"var(--ink-muted)"},svg);t.textContent=formatY(v);}
  el("line",{x1:padL,x2:W-padR,y1:padT+plotH,y2:padT+plotH,stroke:"var(--baseline)","stroke-width":1},svg);
  const tt=makeTooltip(box);
  values.forEach((v,i)=>{
    const cx=padL+slot*i+slot/2;
    const bh=(v/maxV)*plotH;
    const rect=el("rect",{x:cx-barW/2,y:y(v),width:barW,height:Math.max(1,bh),rx:4,ry:4,fill:perBarColors?perBarColors[i]:color,style:"cursor:pointer;transition:opacity .1s"},svg);
    const hit=el("rect",{x:cx-slot/2,y:padT,width:slot,height:plotH,fill:"transparent",style:"cursor:pointer"},svg);
    hit.addEventListener("mousemove",evt=>{
      const rc=svg.getBoundingClientRect();
      rect.style.opacity="0.75";
      showTip(tt,(evt.clientX-rc.left),(evt.clientY-rc.top),`<div class="tt-title">${labels[i]}</div><div class="tt-row"><span class="tt-key"><span class="tt-swatch" style="background:${perBarColors?perBarColors[i]:color}"></span>Value</span><span class="tt-val">${formatY(v)}</span></div>`);
    });
    hit.addEventListener("mouseleave",()=>{rect.style.opacity="1";hideTip(tt);});
    const lb=el("text",{x:cx,y:H-10,"text-anchor":"middle","font-size":10,fill:"var(--ink-muted)"},svg);
    lb.textContent=labels[i].length>10?labels[i].slice(0,9)+"…":labels[i];
  });
}

/* ---- Donut chart, max 6 segments, hover + legend ---- */
function renderDonut(host,{data,size=190,centerLabel="",formatVal=fmtNum}){
  const box=div("chart-box");
  box.style.display="flex";box.style.gap="20px";box.style.alignItems="center";box.style.flexWrap="wrap";
  host.appendChild(box);
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const r=size/2-14,cx=size/2,cy=size/2,strokeW=26;
  const svgWrap=div("");svgWrap.style.position="relative";svgWrap.style.flexShrink="0";
  const svg=el("svg",{viewBox:`0 0 ${size} ${size}`,width:size,height:size},svgWrap);
  const tt=makeTooltip(svgWrap);
  let acc=-90;
  const gapDeg=2;
  data.forEach(d=>{
    const frac=d.value/total;
    const startDeg=acc+gapDeg/2;
    const sweepDeg=Math.max(0,frac*360-gapDeg);
    const endDeg=startDeg+sweepDeg;
    acc+=frac*360;
    const large=sweepDeg>180?1:0;
    const toXY=deg=>{const rad=deg*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];};
    const[sx,sy]=toXY(startDeg),[ex,ey]=toXY(endDeg);
    const path=el("path",{d:`M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`,fill:"none",stroke:d.color,"stroke-width":strokeW,"stroke-linecap":"butt",style:"cursor:pointer;transition:stroke-width .1s"},svg);
    path.addEventListener("mousemove",evt=>{
      const rc=svgWrap.getBoundingClientRect();
      path.setAttribute("stroke-width",strokeW+4);
      showTip(tt,evt.clientX-rc.left,evt.clientY-rc.top,`<div class="tt-title">${d.label}</div><div class="tt-row"><span class="tt-key"><span class="tt-swatch" style="background:${d.color}"></span>Count</span><span class="tt-val">${formatVal(d.value)} (${Math.round(frac*100)}%)</span></div>`);
    });
    path.addEventListener("mouseleave",()=>{path.setAttribute("stroke-width",strokeW);hideTip(tt);});
  });
  if(centerLabel){
    const t1=el("text",{x:cx,y:cy-3,"text-anchor":"middle","font-size":20,"font-weight":800,fill:"var(--ink)"},svg);t1.textContent=formatVal(total);
    const t2=el("text",{x:cx,y:cy+15,"text-anchor":"middle","font-size":10,fill:"var(--ink-muted)"},svg);t2.textContent=centerLabel;
  }
  box.appendChild(svgWrap);
  const lg=div("");lg.style.display="flex";lg.style.flexDirection="column";lg.style.gap="8px";lg.style.flex="1";lg.style.minWidth="140px";
  data.forEach(d=>{
    const row=div("");row.style.cssText="display:flex;align-items:center;gap:8px;font-size:12.5px;";
    const sw=div("legend-swatch");sw.style.background=d.color;row.appendChild(sw);
    const lab=document.createElement("span");lab.style.cssText="flex:1;color:var(--ink-2);font-weight:600;";lab.textContent=d.label;row.appendChild(lab);
    const val=document.createElement("span");val.style.cssText="font-weight:800;color:var(--ink);";val.textContent=formatVal(d.value);row.appendChild(val);
    lg.appendChild(row);
  });
  box.appendChild(lg);
}

/* ---- Funnel chart (ordinal sequential ramp) ---- */
function renderFunnel(host,{stages,height=180}){
  const box=div("chart-box");host.appendChild(box);
  const ramp=["var(--seq-250)","var(--seq-350)","var(--seq-450)","var(--seq-550)","#104281"];
  const max=Math.max(...stages.map(s=>s.value),1);
  const W=800,rowH=height/stages.length;
  const svg=el("svg",{viewBox:`0 0 ${W} ${height}`,style:"width:100%;height:auto;display:block"},box);
  const tt=makeTooltip(box);
  stages.forEach((s,i)=>{
    const frac=s.value/max;
    const w=Math.max(30,frac*(W-160));
    const cy=rowH*i+rowH/2;
    const x0=(W-160-w)/2+70;
    const color=ramp[Math.min(i,ramp.length-1)];
    const rect=el("rect",{x:x0,y:cy-16,width:w,height:32,rx:6,fill:color,style:"cursor:pointer"},svg);
    const lab=el("text",{x:W/2,y:cy+4,"text-anchor":"middle","font-size":12,"font-weight":700,fill:i<2?"var(--ink)":"#fff"},svg);
    lab.textContent=`${s.label} — ${fmtNum(s.value)}`;
    rect.addEventListener("mousemove",evt=>{
      const rc=svg.getBoundingClientRect();
      const pct=i===0?100:Math.round(s.value/stages[0].value*100);
      showTip(tt,evt.clientX-rc.left,evt.clientY-rc.top,`<div class="tt-title">${s.label}</div><div class="tt-row"><span class="tt-key">Count</span><span class="tt-val">${fmtNum(s.value)}</span></div><div class="tt-row"><span class="tt-key">Of top stage</span><span class="tt-val">${pct}%</span></div>`);
    });
    rect.addEventListener("mouseleave",()=>hideTip(tt));
  });
}

/* ---- inline sparkline for stat tiles ---- */
function sparkSVG(values,color){
  const W=120,H=28,pad=3;
  const max=Math.max(...values),min=Math.min(...values,0);
  const x=i=>pad+(W-2*pad)*(i/(values.length-1));
  const y=v=>H-pad-((v-min)/(max-min||1))*(H-2*pad);
  let d="";values.forEach((v,i)=>d+=(i===0?"M":"L")+` ${x(i)} ${y(v)} `);
  const lastI=values.length-1;
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="${x(lastI)}" cy="${y(values[lastI])}" r="3" fill="${color}"/>
  </svg>`;
}

/* ---- stat tile builder ---- */
function statTile(host,{icon,label,value,deltaText,deltaUp,spark,sparkColor="var(--brand)"}){
  const s=div("stat");
  s.innerHTML=`<div class="icon">${icon}</div>
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${deltaText?`<div class="delta ${deltaUp?'up':'down'}">${deltaUp?'▲':'▼'} ${deltaText}</div>`:""}
    ${spark?sparkSVG(spark,sparkColor):""}`;
  host.appendChild(s);
  return s;
}

function card(host,title,sub){
  const c=div("card");
  if(title)c.innerHTML=`<h3>${title}</h3>${sub?`<div class="card-sub">${sub}</div>`:""}`;
  host.appendChild(c);
  return c;
}

    dl.projects.map(p=>{
      const cls=p.status==="Completed"?"good":p.status==="On Hold"?"warn":"neutral";
      return `<tr><td>${p.name}</td><td>${p.cap}</td><td><span class="status-pill ${cls}"><span class="dot" style="background:currentColor"></span>${p.status}</span></td><td>${fmtINR(p.margin)}</td></tr>`;
    }).join("");
  c3.appendChild(tbl);
}

const BUILDERS={admin:buildAdmin,finance:buildFinance,sales:buildSales,technician:buildTechnician,dealer:buildDealer};

/* =========================================================================
   APP INIT — role switcher
   ========================================================================= */
const switchHost=document.getElementById("roleSwitch");
const dashHost=document.getElementById("dashHost");
const captionHost=document.getElementById("roleCaption");
const dashCache={};

ROLES.forEach(r=>{
  const btn=document.createElement("button");
  btn.className="role-btn";btn.dataset.role=r.id;
  btn.innerHTML=`${r.icon} ${r.label}`;
  btn.addEventListener("click",()=>showRole(r.id));
  switchHost.appendChild(btn);
});

function showRole(id){
  ROLES.forEach(r=>{
    document.querySelector(`.role-btn[data-role="${r.id}"]`).classList.toggle("active",r.id===id);
  });
  const roleInfo=ROLES.find(r=>r.id===id);
  captionHost.innerHTML=roleInfo.caption;
  Object.keys(dashCache).forEach(k=>dashCache[k].classList.remove("active"));
  if(!dashCache[id]){
    const d=div("dash");
    BUILDERS[id](d);
    dashHost.appendChild(d);
    dashCache[id]=d;
  }
  dashCache[id].classList.add("active");
}
showRole("admin");
</script>
